name: Strong 8K guide

on:
  schedule:
    - cron: "23 */4 * * *"   # every 4 hours, at :23 past (UTC)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: strong8k-guide
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check the secret
        env:
          M3U: ${{ secrets.STRONG8K_M3U_URL }}
        run: |
          if [ -z "$M3U" ]; then
            echo "::error::Add the repository secret STRONG8K_M3U_URL (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests lxml

      - name: Last published report (outage guard)
        run: |
          if git fetch --depth 1 origin strong8k-guide 2>/dev/null; then
            git show FETCH_HEAD:report.json > /tmp/prev-report.json || true
          fi

      - name: Build guide
        env:
          STRONG8K_M3U_URL: ${{ secrets.STRONG8K_M3U_URL }}
          STRONG8K_XMLTV_URL: ${{ secrets.STRONG8K_XMLTV_URL }}
          STRONG8K_DAYS: ${{ vars.STRONG8K_DAYS || '3' }}
        run: python strong8k/build.py --out /tmp/guide --previous-report /tmp/prev-report.json

      - name: Publish to the strong8k-guide branch
        run: |
          cd /tmp/guide
          cat > README.md <<'EOF'
          Strong 8K XMLTV guide, rebuilt every 4 hours by the "Strong 8K guide"
          workflow on `main`. This branch is replaced on each run (no history).
          See `report.json` for coverage.
          EOF
          git init -q -b strong8k-guide
          git config user.name "epg-bot"
          git config user.email "epg-bot@users.noreply.github.com"
          git add guide.xml.gz report.json README.md
          git commit -q -m "Strong 8K guide $(date -u +'%F %H:%M UTC')"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" strong8k-guide
          echo "### Strong 8K guide" >> "$GITHUB_STEP_SUMMARY"
          python -c "import json;r=json.load(open('report.json'));print(f\"{r['channels_in_guide']} channels, {r['programmes']} programmes, {r['gz_mb']} MB; {r['channels_without_guide']} ids with no guide\")" >> "$GITHUB_STEP_SUMMARY"
